name = "gold-rf-line"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 每分鐘跑一次偵測。2026-10-29 使用者：「D 甲當主力，所有警報只留 D 甲，其它全部停掉」→ 拿掉排程，GA 推播停止；
# /tvalert（TradingView 警報轉發 LINE＋Telegram）照樣可用。要恢復 GA 推播就改回 crons = ["* * * * *"] 再部署。
# 2026-10-31（HP）使用者：「TG LINE 只發趨勢版甲30，其餘都不要」→ 排程打開，改推甲 30；TradingView 不再接 Webhook。
[triggers]
crons = ["* * * * *"]

# KV：存 37 秒 K 歷史（g2bars）與推播狀態（g2state、tvlast）
# 用 npx wrangler kv namespace create STATE 產生 id 後貼進來
[[kv_namespaces]]
binding = "STATE"
id = "df63427b45a5403c8bf2f62f8cafee64"

[vars]
# 留空 = broadcast，發給這個官方帳號的所有好友（只有你自己加好友就等於只發給你）
# 想指定對象再填 LINE 的 userId
LINE_TO = ""

# LINE_TOKEN 是密鑰，不要寫在這裡，用這行設定：
#   npx wrangler secret put LINE_TOKEN
